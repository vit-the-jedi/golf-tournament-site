# example netlify.toml
[build]
  command = "vite build"
  functions = "netlify/functions"
  publish = "dist"

## Uncomment to use this redirect for Single Page Applications
## Not needed for static site generators.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ======== Images redirection 
[[redirects]]
from = "/optimized/gallery/*"
to = "/.netlify/images?url=/src/assets/gallery/:splat&q=60&fit=contain&w=750&h=1050"
status = 200

[[redirects]]
from = "/optimized/images/*"
to = "/.netlify/images?url=/src/assets/:splat&q=90&fit=contain"
status = 200
